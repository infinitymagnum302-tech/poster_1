
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALL EYES ON US — AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; width: 100%; height: 100%;
      overflow: hidden; background: #171020; font-family: Arial, sans-serif; }
    #message {
      position: fixed; z-index: 10; top: 18px; left: 12px; right: 12px;
      text-align: center; color: white; font-size: 16px;
      background: #32194ddd; padding: 12px; border-radius: 12px;
    }
    #start {
      position: fixed; z-index: 20; inset: 0; margin: auto;
      width: 220px; height: 54px; border: 0; border-radius: 12px;
      background: #ff9933; color: #171020; font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="message">Tap Start, then point your camera at the poster.</div>
  <button id="start">Start AR</button>

  <a-scene
    mindar-image="imageTargetSrc: ./poster.mind; autoStart: false;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="eyesVideo"
        src="./eyes.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="posterTarget" mindar-image-target="targetIndex: 0">
      <!-- Video covers the tracked poster. Adjust dimensions if needed. -->
      <a-video
        src="#eyesVideo"
        position="0 0 0.01"
        width="1"
        height="1.414"
        rotation="0 0 0">
      </a-video>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");
    const startButton = document.querySelector("#start");
    const message = document.querySelector("#message");
    const video = document.querySelector("#eyesVideo");
    const target = document.querySelector("#posterTarget");

    target.addEventListener("targetFound", () => {
      message.textContent = "Poster detected!";
      video.currentTime = 0;
      video.play().catch(() => {
        message.textContent = "Tap the screen to play the video.";
      });
    });

    target.addEventListener("targetLost", () => {
      video.pause();
      message.textContent = "Poster lost. Point your camera at it again.";
    });

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      startButton.textContent = "Starting camera...";
     // Unlock muted video playback during the user's tap
try {
  await video.play();
  video.pause();
  video.currentTime = 0;
} catch (e) {
  console.log("Video playback will be retried when the poster is found.", e);
}

await scene.systems["mindar-image-system"].start();
startButton.style.display = "none";
message.textContent = "Point the camera at the poster.";
      } catch (error) {
        console.error(error);
        message.textContent =
          "Camera failed. Allow camera access and reload the page.";
        startButton.disabled = false;
        startButton.textContent = "Try Again";
      }
    });
  </script>
</body>
</html>
